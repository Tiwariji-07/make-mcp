name: "Feature request"
description: Suggest a capability, an option, or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow, not just the solution — it helps us find the best fit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like mcpmint to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
    validations:
      required: false
